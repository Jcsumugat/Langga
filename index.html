<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you &lt;3</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
  }
  #startOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    cursor: pointer;
  }
  #startOverlay p {
    color: rgba(255, 250, 245, 0.85);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(18px, 4vw, 32px);
    letter-spacing: 0.04em;
    animation: pulseText 2.2s ease-in-out infinite;
    text-align: center;
    padding: 0 24px;
  }
  @keyframes pulseText {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div id="startOverlay">
  <p>Hi tin, click anywhere po</p>
</div>

<canvas id="scene"></canvas>
<audio id="bgMusic" src="love_you.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const audio = document.getElementById('bgMusic');
const overlay = document.getElementById('startOverlay');

let WIDTH, HEIGHT, SCALE;

function resize() {
  WIDTH = canvas.width = window.innerWidth;
  HEIGHT = canvas.height = window.innerHeight;
  SCALE = Math.min(WIDTH, HEIGHT) / 60;
}
resize();
window.addEventListener('resize', resize);

const WORDS = ["love you", "Love You", "LOVE YOU"];
const CENTER_TEXT = "Love You";
const COLORS = [
  "rgb(70,130,180)",
  "rgb(30,144,255)",
  "rgb(0,191,255)",
  "rgb(100,149,237)",
  "rgb(65,105,225)"
];

function heartXY(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return [x, -y];
}

function toScreen(x, y) {
  return [x * SCALE + WIDTH / 2, y * SCALE + HEIGHT / 2];
}

class Particle {
  constructor(x, y, order, kind, fontSize) {
    this.x = x;
    this.y = y;
    this.order = order;
    this.kind = kind;
    this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.alpha = 0;
    this.flicker = Math.random() * Math.PI * 2;
    this.delay = 0;
    this.fontSize = fontSize * (0.85 + Math.random() * 0.3);
  }
}

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function buildOutlineParticles(nOutline, minGap) {
  const particles = [];
  const placed = [];
  for (let i = 0; i < nOutline; i++) {
    const t = (i / nOutline) * 2 * Math.PI;
    const [bx, by] = heartXY(t);
    const [sx, sy] = toScreen(bx, by);
    if (placed.some(([px, py]) => dist(sx, sy, px, py) < minGap)) continue;
    placed.push([sx, sy]);
    particles.push(new Particle(sx, sy, i, "outline", Math.max(12, SCALE * 0.9)));
  }
  return particles;
}

function buildFillParticles(nFill, minGap) {
  const particles = [];
  const placed = [];
  let attempts = 0;
  const maxAttempts = nFill * 80;
  while (particles.length < nFill && attempts < maxAttempts) {
    attempts++;
    const t = Math.random() * 2 * Math.PI;
    const r = Math.random() * 0.86;
    const [bx, by] = heartXY(t);
    const px = bx * r, py = by * r;
    const [sx, sy] = toScreen(px, py);
    if (placed.some(([qx, qy]) => dist(sx, sy, qx, qy) < minGap)) continue;
    placed.push([sx, sy]);
    particles.push(new Particle(sx, sy, Math.floor(Math.random() * 320), "fill", Math.max(10, SCALE * 0.75)));
  }
  return particles;
}

let particles = [];
let fillStartFrame = 0;
let frame = 0;
let centerStartFrame = 0;

function setupParticles() {
  const outline = buildOutlineParticles(160, SCALE * 1.5);
  const fill = buildFillParticles(130, SCALE * 2.3);

  const outlineSpan = outline.length ? Math.max(...outline.map(p => p.order)) : 0;
  const framesPerStep = 1.6;
  fillStartFrame = Math.floor(outlineSpan * framesPerStep) + 30;

  fill.forEach(p => p.delay = fillStartFrame + p.order);
  outline.forEach(p => p.delay = Math.floor(p.order * framesPerStep));

  particles = outline.concat(fill);
  centerStartFrame = fillStartFrame + 200;
}

function drawGlowText(p, alpha) {
  if (alpha <= 0) return;
  ctx.font = `bold ${p.fontSize}px Arial`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  const a = alpha / 255;

  if (alpha > 10) {
    ctx.save();
    ctx.globalAlpha = a * (1 / 7) * 2.2;
    ctx.font = `bold ${p.fontSize * 2.4}px Arial`;
    ctx.fillStyle = p.color;
    ctx.filter = "blur(6px)";
    ctx.fillText(p.word, p.x, p.y);
    ctx.restore();

    ctx.save();
    ctx.globalAlpha = a * (1 / 3) * 1.1;
    ctx.font = `bold ${p.fontSize * 1.6}px Arial`;
    ctx.fillStyle = p.color;
    ctx.filter = "blur(3px)";
    ctx.fillText(p.word, p.x, p.y);
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = a;
  ctx.fillStyle = p.color;
  ctx.fillText(p.word, p.x, p.y);
  ctx.restore();
}

function drawCenterText() {
  if (frame <= centerStartFrame) return;

  const progress = Math.min(1.0, (frame - centerStartFrame) / 60);
  const centerAlpha = 255 * (1 - Math.exp(-progress * 8));
  const pulse = 1.0 + 0.025 * Math.sin(frame * 0.05);
  const baseSize = Math.max(28, SCALE * 2.6);
  const fontSize = baseSize * pulse;

  ctx.font = `bold ${fontSize}px Georgia, serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if (centerAlpha > 10) {
    ctx.save();
    ctx.globalAlpha = (centerAlpha / 255) / 5;
    ctx.font = `bold ${fontSize * 1.4}px Georgia, serif`;
    ctx.fillStyle = "rgb(255,250,245)";
    ctx.filter = "blur(8px)";
    ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2);
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = centerAlpha / 255;
  ctx.fillStyle = "rgb(255,250,245)";
  ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2);
  ctx.restore();
}

function tick() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  frame++;

  for (const p of particles) {
    if (frame > p.delay && p.alpha < 255) {
      p.alpha = Math.min(255, p.alpha + 14 + Math.random() * 4);
    }

    let flick = 1.0;
    if (p.alpha >= 255) {
      flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker);
    }

    const alpha = p.alpha * flick;
    if (alpha <= 0) continue;
    drawGlowText(p, alpha);
  }

  drawCenterText();
  requestAnimationFrame(tick);
}

function start() {
  overlay.style.display = "none";
  audio.currentTime = 0;
  audio.loop = true;
  audio.play().catch(() => {
    // Autoplay was blocked for some reason; animation still runs.
  });
  setupParticles();
  frame = 0;
  requestAnimationFrame(tick);
}

overlay.addEventListener('click', start, { once: true });
</script>

</body>
</html>
