<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>I love you &lt;3</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #000;
    overflow: hidden;
    width: 100%;
    height: 100%;
  }
  canvas {
    display: block;
  }
  #startOverlay {
    position: fixed;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
    cursor: pointer;
  }
  #startOverlay p {
    color: rgba(255, 250, 245, 0.85);
    font-family: Georgia, 'Times New Roman', serif;
    font-size: clamp(18px, 4vw, 32px);
    letter-spacing: 0.04em;
    animation: pulseText 2.2s ease-in-out infinite;
    text-align: center;
    padding: 0 24px;
  }
  @keyframes pulseText {
    0%, 100% { opacity: 0.55; }
    50% { opacity: 1; }
  }
</style>
</head>
<body>

<div id="startOverlay">
  <p>Hi tin, click anywhere po</p>
</div>

<canvas id="scene"></canvas>
<audio id="bgMusic" src="love_you.mp3" preload="auto"></audio>

<script>
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d');
const audio = document.getElementById('bgMusic');
const overlay = document.getElementById('startOverlay');

let WIDTH, HEIGHT, SCALE;

function resize() {
  WIDTH = canvas.width = window.innerWidth;
  HEIGHT = canvas.height = window.innerHeight;
  SCALE = Math.min(WIDTH, HEIGHT) / 60;
}
resize();
window.addEventListener('resize', resize);

const WORDS = ["love you", "Love You", "LOVE YOU"];
const CENTER_TEXT = "Love You";
const COLORS = [
  "rgb(70,130,180)",
  "rgb(30,144,255)",
  "rgb(0,191,255)",
  "rgb(100,149,237)",
  "rgb(65,105,225)"
];
const SPARKLE_COLORS = [
  "rgb(255,255,255)",
  "rgb(255,245,220)",
  "rgb(180,220,255)",
  "rgb(255,215,255)"
];

function heartXY(t) {
  const x = 16 * Math.pow(Math.sin(t), 3);
  const y = 13 * Math.cos(t) - 5 * Math.cos(2 * t) - 2 * Math.cos(3 * t) - Math.cos(4 * t);
  return [x, -y];
}

function toScreen(x, y) {
  return [x * SCALE + WIDTH / 2, y * SCALE + HEIGHT / 2];
}

const measureCanvas = document.createElement('canvas');
const measureCtx = measureCanvas.getContext('2d');

class Particle {
  constructor(x, y, order, kind, fontSize) {
    this.x = x;
    this.y = y;
    this.order = order;
    this.kind = kind;
    this.word = WORDS[Math.floor(Math.random() * WORDS.length)];
    this.color = COLORS[Math.floor(Math.random() * COLORS.length)];
    this.alpha = 0;
    this.flicker = Math.random() * Math.PI * 2;
    this.delay = 0;
    this.fontSize = fontSize * (0.85 + Math.random() * 0.3);
    this.buildSprite();
  }

  buildSprite() {
    // Pre-render the glow + text once to an offscreen canvas so the
    // expensive blur filter isn't re-run every animation frame.
    const bigFont = this.fontSize * 2.4;
    const padding = Math.ceil(bigFont * 0.5);

    measureCtx.font = `bold ${bigFont}px Arial`;
    const textWidth = measureCtx.measureText(this.word).width;

    const w = Math.ceil(textWidth + padding * 2);
    const h = Math.ceil(bigFont + padding * 2);

    const sprite = document.createElement('canvas');
    sprite.width = w;
    sprite.height = h;
    const sctx = sprite.getContext('2d');
    const cx = w / 2;
    const cy = h / 2;

    sctx.textAlign = "center";
    sctx.textBaseline = "middle";

    sctx.save();
    sctx.globalAlpha = (1 / 7) * 2.2;
    sctx.font = `bold ${this.fontSize * 2.4}px Arial`;
    sctx.fillStyle = this.color;
    sctx.filter = "blur(6px)";
    sctx.fillText(this.word, cx, cy);
    sctx.restore();

    sctx.save();
    sctx.globalAlpha = (1 / 3) * 1.1;
    sctx.font = `bold ${this.fontSize * 1.6}px Arial`;
    sctx.fillStyle = this.color;
    sctx.filter = "blur(3px)";
    sctx.fillText(this.word, cx, cy);
    sctx.restore();

    sctx.save();
    sctx.globalAlpha = 1;
    sctx.font = `bold ${this.fontSize}px Arial`;
    sctx.fillStyle = this.color;
    sctx.fillText(this.word, cx, cy);
    sctx.restore();

    this.sprite = sprite;
    this.spriteW = w;
    this.spriteH = h;
  }
}

// Pre-rendered 4-point sparkle/star sprite with a soft glow baked in.
function createStarSprite(size, color) {
  const s = Math.ceil(size * 8);
  const c = document.createElement('canvas');
  c.width = s;
  c.height = s;
  const sc = c.getContext('2d');
  const cx = s / 2;
  const cy = s / 2;

  function drawSpike(alpha, blur, scale) {
    sc.save();
    sc.globalAlpha = alpha;
    if (blur) sc.filter = `blur(${blur}px)`;
    sc.fillStyle = color;
    const r = size * scale;
    sc.beginPath();
    sc.moveTo(cx, cy - r * 2);
    sc.quadraticCurveTo(cx, cy, cx + r * 2, cy);
    sc.quadraticCurveTo(cx, cy, cx, cy + r * 2);
    sc.quadraticCurveTo(cx, cy, cx - r * 2, cy);
    sc.quadraticCurveTo(cx, cy, cx, cy - r * 2);
    sc.closePath();
    sc.fill();
    sc.restore();
  }

  drawSpike(0.25, size * 1.2, 1.4);
  drawSpike(0.55, size * 0.4, 1.0);
  drawSpike(1.0, 0, 0.45);

  return c;
}

class Sparkle {
  constructor(initial) {
    this.x = Math.random() * WIDTH;
    this.y = Math.random() * HEIGHT;
    this.phase = Math.random() * Math.PI * 2;
    this.speed = 0.02 + Math.random() * 0.05;
    this.baseAlpha = 0.35 + Math.random() * 0.65;
    this.appearFrame = initial
      ? Math.floor(Math.random() * 300)
      : frame + Math.floor(Math.random() * 300);

    const size = 2.5 + Math.random() * 4.5;
    const color = SPARKLE_COLORS[Math.floor(Math.random() * SPARKLE_COLORS.length)];
    this.sprite = createStarSprite(size, color);
    this.spriteSize = this.sprite.width;
  }
}

function dist(x1, y1, x2, y2) {
  return Math.hypot(x1 - x2, y1 - y2);
}

function buildOutlineParticles(nOutline, minGap) {
  const particles = [];
  const placed = [];
  for (let i = 0; i < nOutline; i++) {
    const t = (i / nOutline) * 2 * Math.PI;
    const [bx, by] = heartXY(t);
    const [sx, sy] = toScreen(bx, by);
    if (placed.some(([px, py]) => dist(sx, sy, px, py) < minGap)) continue;
    placed.push([sx, sy]);
    particles.push(new Particle(sx, sy, i, "outline", Math.max(12, SCALE * 0.9)));
  }
  return particles;
}

function buildFillParticles(nFill, minGap) {
  const particles = [];
  const placed = [];
  let attempts = 0;
  const maxAttempts = nFill * 80;
  while (particles.length < nFill && attempts < maxAttempts) {
    attempts++;
    const t = Math.random() * 2 * Math.PI;
    const r = Math.random() * 0.86;
    const [bx, by] = heartXY(t);
    const px = bx * r, py = by * r;
    const [sx, sy] = toScreen(px, py);
    if (placed.some(([qx, qy]) => dist(sx, sy, qx, qy) < minGap)) continue;
    placed.push([sx, sy]);
    particles.push(new Particle(sx, sy, Math.floor(Math.random() * 320), "fill", Math.max(10, SCALE * 0.75)));
  }
  return particles;
}

let particles = [];
let sparkles = [];
let fillStartFrame = 0;
let frame = 0;
let centerStartFrame = 0;

// Slower pacing: bigger gap between each outline particle's reveal,
// a longer pause before the fill starts, and a slower per-frame fade-in.
const FRAMES_PER_STEP = 3.2;
const FILL_PAUSE = 70;
const CENTER_DELAY = 260;
const FADE_STEP_MIN = 6;
const FADE_STEP_RAND = 4;

function setupParticles() {
  const outline = buildOutlineParticles(160, SCALE * 1.5);
  const fill = buildFillParticles(130, SCALE * 2.3);

  const outlineSpan = outline.length ? Math.max(...outline.map(p => p.order)) : 0;
  fillStartFrame = Math.floor(outlineSpan * FRAMES_PER_STEP) + FILL_PAUSE;

  fill.forEach(p => p.delay = fillStartFrame + p.order * 1.5);
  outline.forEach(p => p.delay = Math.floor(p.order * FRAMES_PER_STEP));

  particles = outline.concat(fill);
  centerStartFrame = fillStartFrame + CENTER_DELAY;
}

function setupSparkles(n) {
  sparkles = [];
  for (let i = 0; i < n; i++) {
    sparkles.push(new Sparkle(true));
  }
}

function drawParticleSprite(p, alpha) {
  if (alpha <= 0 || !p.sprite) return;
  ctx.save();
  ctx.globalAlpha = alpha / 255;
  ctx.drawImage(p.sprite, p.x - p.spriteW / 2, p.y - p.spriteH / 2);
  ctx.restore();
}

function drawSparkles() {
  for (const s of sparkles) {
    if (frame < s.appearFrame) continue;
    const twinkle = 0.5 + 0.5 * Math.sin(frame * s.speed + s.phase);
    const alpha = s.baseAlpha * twinkle;
    if (alpha <= 0.03) continue;
    ctx.save();
    ctx.globalAlpha = alpha;
    ctx.drawImage(s.sprite, s.x - s.spriteSize / 2, s.y - s.spriteSize / 2);
    ctx.restore();
  }
}

function drawCenterText() {
  if (frame <= centerStartFrame) return;

  const progress = Math.min(1.0, (frame - centerStartFrame) / 90);
  const centerAlpha = 255 * (1 - Math.exp(-progress * 6));
  const pulse = 1.0 + 0.025 * Math.sin(frame * 0.05);
  const baseSize = Math.max(28, SCALE * 2.6);
  const fontSize = baseSize * pulse;

  ctx.font = `bold ${fontSize}px Georgia, serif`;
  ctx.textAlign = "center";
  ctx.textBaseline = "middle";

  if (centerAlpha > 10) {
    ctx.save();
    ctx.globalAlpha = (centerAlpha / 255) / 5;
    ctx.font = `bold ${fontSize * 1.4}px Georgia, serif`;
    ctx.fillStyle = "rgb(255,250,245)";
    ctx.filter = "blur(8px)";
    ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2);
    ctx.restore();
  }

  ctx.save();
  ctx.globalAlpha = centerAlpha / 255;
  ctx.fillStyle = "rgb(255,250,245)";
  ctx.fillText(CENTER_TEXT, WIDTH / 2, HEIGHT / 2);
  ctx.restore();
}

function tick() {
  ctx.fillStyle = "#000";
  ctx.fillRect(0, 0, WIDTH, HEIGHT);
  frame++;

  drawSparkles();

  for (const p of particles) {
    if (frame > p.delay && p.alpha < 255) {
      p.alpha = Math.min(255, p.alpha + FADE_STEP_MIN + Math.random() * FADE_STEP_RAND);
    }

    let flick = 1.0;
    if (p.alpha >= 255) {
      flick = 0.75 + 0.25 * Math.sin(frame * 0.04 + p.flicker);
    }

    const alpha = p.alpha * flick;
    if (alpha <= 0) continue;
    drawParticleSprite(p, alpha);
  }

  drawCenterText();
  requestAnimationFrame(tick);
}

function start() {
  overlay.style.display = "none";
  audio.currentTime = 0;
  audio.loop = true;
  audio.play().catch(() => {
    // Autoplay was blocked for some reason; animation still runs.
  });
  setupParticles();
  setupSparkles(90);
  frame = 0;
  requestAnimationFrame(tick);
}

overlay.addEventListener('click', start, { once: true });
</script>

</body>
</html>
